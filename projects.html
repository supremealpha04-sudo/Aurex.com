<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aurex Academy - Projects</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js">
    </script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-primary: #070714; --bg-secondary: #0d0d1f; --bg-card: #13132a; --bg-card-hover: #1a1a3e;
            --bg-elevated: #1c1c42; --accent-purple: #7c3aed; --accent-violet: #a855f7; --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4; --accent-pink: #ec4899; --accent-orange: #f59e0b; --accent-green: #22c55e;
            --accent-red: #ef4444; --text-primary: #f8fafc; --text-secondary: #94a3b8; --text-muted: #64748b;
            --border-color: rgba(148, 163, 184, 0.08); --gradient-purple: linear-gradient(135deg, #7c3aed 0%, #6366f1 50%, #3b82f6 100%);
            --shadow-glow: 0 0 60px rgba(124, 58, 237, 0.12); --sidebar-width: 260px; --sidebar-collapsed: 72px;
        }
        html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); overflow-x: hidden; min-height: 100vh; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(124, 58, 237, 0.3); border-radius: 10px; }

        .app-container { display: flex; min-height: 100vh; position: relative; overflow-x: hidden; }

        .sidebar {
            width: var(--sidebar-width); background: var(--bg-secondary); border-right: 1px solid var(--border-color);
            padding: 16px 12px; position: fixed; top: 0; left: 0; height: 100vh; height: 100dvh;
            overflow-y: auto; overflow-x: hidden; z-index: 300;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; will-change: transform; -webkit-overflow-scrolling: touch;
        }
        @media (min-width: 901px) { .sidebar { transform: translateX(0); } .sidebar-overlay { display: none !important; } }
        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); width: var(--sidebar-width) !important; box-shadow: 10px 0 40px rgba(0,0,0,0.5); padding: 16px 12px; }
            .sidebar.mobile-open { transform: translateX(0); }
            .sidebar.mobile-open .logo-text-wrap, .sidebar.mobile-open .nav-item span { opacity: 1 !important; pointer-events: auto !important; width: auto !important; }
            .sidebar.mobile-open .sidebar-logo { justify-content: flex-start; padding: 0 8px 16px; }
            .sidebar.mobile-open .nav-item { justify-content: flex-start; padding: 10px 12px; }
        }
        .sidebar.collapsed { width: var(--sidebar-collapsed); }
        .sidebar.collapsed .logo-text-wrap, .sidebar.collapsed .nav-item span { opacity: 0; pointer-events: none; width: 0; overflow: hidden; }
        .sidebar.collapsed .sidebar-logo { justify-content: center; padding: 0 0 16px; }
        .sidebar.collapsed .nav-item { justify-content: center; padding: 12px; }
        .sidebar.collapsed .nav-item i { width: auto; font-size: 18px; }
        .sidebar.collapsed .sidebar-toggle { right: -11px; }
        .sidebar.collapsed .sidebar-toggle i { transform: rotate(180deg); }

        .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 8px 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 12px; position: relative; transition: all 0.35s; }
        .logo-icon { width: 36px; height: 36px; min-width: 36px; background: var(--gradient-purple); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; box-shadow: 0 4px 20px rgba(124,58,237,0.3); }
        .logo-icon img { width: 28px; height: 28px; border-radius: 6px; object-fit: contain; }
        .logo-text-wrap { transition: opacity 0.25s; white-space: nowrap; }
        .logo-text { font-size: 18px; font-weight: 700; background: var(--gradient-purple); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-sub { font-size: 9px; color: var(--text-muted); letter-spacing: 2px; }
        .sidebar-toggle { position: absolute; right: -6px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 5px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 8px; transition: all 0.2s; z-index: 10; }
        .sidebar-toggle:hover { background: var(--accent-purple); color: white; border-color: var(--accent-purple); }
        @media (max-width: 900px) { .sidebar-toggle { display: none; } }

        .nav-section { margin-bottom: 4px; }
        .nav-section-title { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; padding: 0 12px; margin-bottom: 6px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; cursor: pointer; transition: all 0.2s; color: var(--text-secondary); font-size: 12px; font-weight: 500; position: relative; margin-bottom: 2px; white-space: nowrap; text-decoration: none; }
        .nav-item:hover { background: rgba(124,58,237,0.08); color: var(--text-primary); }
        .nav-item.active { background: linear-gradient(90deg, rgba(124,58,237,0.15) 0%, rgba(124,58,237,0.05) 100%); color: var(--accent-violet); }
        .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 16px; background: var(--gradient-purple); border-radius: 0 3px 3px 0; }
        .nav-item i { width: 20px; text-align: center; font-size: 14px; }
        .sidebar-divider { height: 1px; background: var(--border-color); margin: 10px 8px; }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 250; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

        .main-content { flex: 1; margin-left: var(--sidebar-width); padding: 0; min-height: 100vh; min-height: 100dvh; transition: margin-left 0.35s cubic-bezier(0.4,0,0.2,1); overflow-x: hidden; max-width: 100vw; }
        .main-content.sidebar-collapsed { margin-left: var(--sidebar-collapsed); }
        @media (max-width: 900px) { .main-content { margin-left: 0 !important; } }

        .top-bar {
            position: sticky; top: 8px; z-index: 150; display: flex; align-items: center; justify-content: space-between;
            margin: 8px 16px 20px; padding: 10px 16px; background: rgba(13,13,31,0.8); backdrop-filter: blur(20px);
            border: 1px solid rgba(148,163,184,0.08); border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: all 0.3s ease; flex-wrap: wrap; gap: 8px;
        }
        .top-bar .page-title { font-size: 16px; font-weight: 700; background: linear-gradient(135deg, #fff 0%, #c4b5fd 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .icon-btn { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .icon-btn:hover { background: rgba(124,58,237,0.1); border-color: rgba(124,58,237,0.2); color: var(--text-primary); }
        .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; border-radius: 10px; background: var(--gradient-purple); color: white; border: none; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(124,58,237,0.3); }

        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin: 0 16px 32px; }
        .project-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; transition: all 0.35s cubic-bezier(0.4,0,0.2,1); cursor: pointer; }
        .project-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-glow), 0 20px 50px rgba(0,0,0,0.3); border-color: rgba(124,58,237,0.15); }
        .project-card .project-image { height: 180px; position: relative; overflow: hidden; }
        .project-card .project-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .project-card:hover .project-image img { transform: scale(1.05); }
        .project-card .project-body { padding: 14px; }
        .project-card .project-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
        .project-card .project-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .project-card .project-meta { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--border-color); }
        .project-card .project-meta .stat { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); }
        .project-card .project-meta .stat i { font-size: 12px; }

        .status-badge { display: inline-flex; padding: 3px 10px; border-radius: 6px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-completed { background: rgba(34,197,94,0.15); color: var(--accent-green); }
        .status-in-progress { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
        .status-pending { background: rgba(245,158,11,0.15); color: var(--accent-orange); }

        .empty-state { text-align: center; padding: 60px 20px; grid-column: 1 / -1; }
        .empty-state i { font-size: 48px; color: var(--text-muted); margin-bottom: 16px; opacity: 0.3; }
        .empty-state h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .empty-state p { font-size: 13px; color: var(--text-muted); }

        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 8px; z-index: 2000; transform: translateY(100px); opacity: 0; transition: all 0.35s cubic-bezier(0.4,0,0.2,1); box-shadow: 0 20px 50px rgba(0,0,0,0.3); max-width: calc(100vw - 40px); }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-color: rgba(34,197,94,0.2); }
        .toast.error { border-color: rgba(239,68,68,0.2); }
        .toast i { font-size: 16px; flex-shrink: 0; }
        .toast.success i { color: #22c55e; }
        .toast.error i { color: #ef4444; }

        .loading-overlay { position: fixed; inset: 0; background: var(--bg-primary); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.6s; }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(124,58,237,0.15); border-top-color: var(--accent-purple); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay p { margin-top: 14px; color: var(--text-muted); font-size: 12px; }

        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: rgba(13,13,31,0.9); backdrop-filter: blur(20px); border-top: 1px solid var(--border-color); padding: 6px 0 10px; z-index: 100; }
        .bottom-nav-item { flex: 1; text-align: center; color: var(--text-muted); font-size: 9px; cursor: pointer; padding: 4px 0; transition: color 0.2s; text-decoration: none; }
        .bottom-nav-item i { font-size: 18px; display: block; margin-bottom: 2px; }
        .bottom-nav-item.active { color: var(--accent-violet); }
        .bottom-nav-item .center-btn { width: 48px; height: 48px; background: var(--gradient-purple); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: -20px auto 2px; color: white; font-size: 20px; box-shadow: 0 4px 20px rgba(124,58,237,0.4); }
        @media (max-width: 900px) { .bottom-nav { display: flex; } .main-content { padding-bottom: 60px; } }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeInUp 0.6s cubic-bezier(0.4,0,0.2,1) forwards; opacity: 0; }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingScreen">
        <div class="spinner"></div>
        <p>Loading Projects...</p>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%237c3aed'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EA%3C/text%3E%3C/svg%3E" alt="Aurex"></div>
                <div class="logo-text-wrap"><div class="logo-text">Aurex</div><div class="logo-sub">PROJECTS</div></div>
                <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-chevron-left"></i></button>
            </div>
            <nav>
                <div class="nav-section"><div class="nav-section-title">Main</div>
                    <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
                    <a href="projects.html" class="nav-item active"><i class="fas fa-folder"></i><span>Projects</span></a>
                    <a href="academy.html" class="nav-item"><i class="fas fa-graduation-cap"></i><span>Academy</span></a>
                    <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
                </div>
                <div class="sidebar-divider"></div>
                <div class="nav-section"><div class="nav-section-title">Account</div>
                    <a href="profile.html" class="nav-item"><i class="fas fa-cog"></i><span>Settings</span></a>
                </div>
            </nav>
        </aside>

        <main class="main-content" id="mainContent">
            <div class="top-bar" id="topBar">
                <div style="display:flex;align-items:center;gap:10px;">
                    <button class="icon-btn" id="mobileMenuBtn" style="display:none;"><i class="fas fa-bars"></i></button>
                    <div class="page-title">Projects</div>
                </div>
                <div class="top-actions">
                    <button class="btn-primary" onclick="window.location.href='auth.html'"><i class="fas fa-sign-in-alt"></i> Sign In</button>
                </div>
            </div>

            <div class="projects-grid animate-in" id="projectsGrid"></div>
        </main>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item"><i class="fas fa-home"></i>Home</a>
        <a href="projects.html" class="bottom-nav-item active"><div class="center-btn"><i class="fas fa-folder"></i></div>Projects</a>
        <a href="academy.html" class="bottom-nav-item"><i class="fas fa-graduation-cap"></i>Academy</a>
        <a href="profile.html" class="bottom-nav-item"><i class="fas fa-user"></i>Profile</a>
    </nav>

    <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg">Success!</span></div>

    <script>
        var CONFIG = window.AUREX_CONFIG || {};
        
        var supabase = null;
        var supabaseConfigured = false;

        try {
            if (CONFIG.supabase && CONFIG.supabase.url && CONFIG.supabase.anonKey) {
                supabase = window.supabase.createClient(
                    CONFIG.supabase.url,
                    CONFIG.supabase.anonKey
                );
                supabaseConfigured = true;
            }
        } catch (e) { console.warn('Supabase connection error:', e.message); }

        function showToast(msg, type) {
            type = type || 'success';
            var t = document.getElementById('toast');
            if (!t) return;
            t.innerHTML = '<i class="fas ' + (type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle') + '"></i> ' + msg;
            t.className = 'toast ' + type + ' show';
            clearTimeout(t._hide);
            t._hide = setTimeout(function() { t.classList.remove('show'); }, 3500);
        }

        var DEMO_PROJECTS = [
            { id: 1, title: 'PrimeMar Brand Identity', description: 'Complete brand overhaul for a tech startup including logo design, color system, typography guidelines, and comprehensive brand book.', status: 'completed', category: 'branding', image: 'https://images.unsplash.com/photo-1561070791-2526d30994b5?w=600&h=400&fit=crop', likes: 12, comments: 4 },
            { id: 2, title: 'EcoPack Sustainable Packaging', description: 'Eco-friendly packaging design series for a sustainable cosmetics brand, featuring biodegradable materials and minimalist aesthetics.', status: 'in-progress', category: 'packaging', image: 'https://images.unsplash.com/photo-1586717791821-3f44a563fa4c?w=600&h=400&fit=crop', likes: 8, comments: 2 },
            { id: 3, title: 'Motion Flow App UI/UX', description: 'UI/UX design and motion graphics for a fitness tracking application with real-time data visualization and engaging micro-interactions.', status: 'pending', category: 'uiux', image: 'https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?w=600&h=400&fit=crop', likes: 15, comments: 6 },
            { id: 4, title: 'Luxe Cosmetics Brand Book', description: 'Premium brand identity and packaging design for a luxury cosmetics line. Complete brand guidelines and visual identity system.', status: 'completed', category: 'branding', image: 'https://images.unsplash.com/photo-1558655146-9f40138edfeb?w=600&h=400&fit=crop', likes: 20, comments: 8 }
        ];

        function loadProjects() {
            var grid = document.getElementById('projectsGrid');
            try {
                if (supabaseConfigured) {
                    supabase.from('projects').select('*').order('created_at', { ascending: false }).limit(10).then(function(result) {
                        if (!result.error && result.data && result.data.length > 0) {
                            renderProjects(result.data);
                        } else {
                            renderProjects(DEMO_PROJECTS);
                        }
                    }).catch(function() {
                        renderProjects(DEMO_PROJECTS);
                    });
                } else {
                    renderProjects(DEMO_PROJECTS);
                }
            } catch (e) { renderProjects(DEMO_PROJECTS); }
        }

        function renderProjects(projects) {
            var grid = document.getElementById('projectsGrid');
            if (!projects || projects.length === 0) {
                grid.innerHTML = '<div class="empty-state"><i class="fas fa-folder-open"></i><h3>No projects yet</h3><p>Check back soon for new projects!</p></div>';
                return;
            }
            grid.innerHTML = projects.map(function(p) {
                return '<div class="project-card">' +
                    '<div class="project-image">' +
                    '<img src="' + (p.image || 'https://via.placeholder.com/600x400/1a1a3e/7c3aed?text=' + encodeURIComponent(p.title)) + '" alt="' + p.title + '" loading="lazy">' +
                    '<div style="position:absolute;top:12px;right:12px;"><span class="status-badge status-' + (p.status || 'pending') + '">' + (p.status || 'pending') + '</span></div>' +
                    '</div>' +
                    '<div class="project-body">' +
                    '<div class="project-title">' + p.title + '</div>' +
                    '<div class="project-desc">' + (p.description || '') + '</div>' +
                    '<div class="project-meta">' +
                    '<span class="stat"><i class="fas fa-heart" style="color:var(--accent-pink);"></i> ' + (p.likes || 0) + '</span>' +
                    '<span class="stat"><i class="fas fa-comment"></i> ' + (p.comments || p.comments_count || 0) + '</span>' +
                    '<span class="stat"><i class="fas fa-tag"></i> ' + (p.category || 'General') + '</span>' +
                    '</div></div></div>';
            }).join('');
        }

        document.getElementById('sidebarToggle')?.addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('collapsed');
            document.getElementById('mainContent').classList.toggle('sidebar-collapsed');
        });

        var mmb = document.getElementById('mobileMenuBtn');
        if (mmb) {
            mmb.style.display = window.innerWidth <= 900 ? 'flex' : 'none';
            mmb.addEventListener('click', function() {
                document.getElementById('sidebar').classList.toggle('mobile-open');
                document.getElementById('sidebarOverlay').classList.toggle('active');
            });
        }
        document.getElementById('sidebarOverlay')?.addEventListener('click', function() {
            document.getElementById('sidebar').classList.remove('mobile-open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        });

        window.addEventListener('scroll', function() {
            var topBar = document.getElementById('topBar');
            if (window.scrollY > 20) topBar.classList.add('scrolled');
            else topBar.classList.remove('scrolled');
        });

        function autoDetectDevice() {
            var isMobile = window.innerWidth <= 900;
            if (mmb) mmb.style.display = isMobile ? 'flex' : 'none';
            if (!isMobile) {
                document.getElementById('sidebar').classList.remove('mobile-open');
                document.getElementById('sidebarOverlay').classList.remove('active');
            }
        }
        window.addEventListener('resize', autoDetectDevice);

        function init() {
            autoDetectDevice();
            loadProjects();
            setTimeout(function() {
                document.getElementById('loadingScreen').classList.add('hidden');
            }, 600);
        }

        window.showToast = showToast;
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
