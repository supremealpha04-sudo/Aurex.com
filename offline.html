<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Aurex Designs</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f1a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .offline-container {
            text-align: center;
            max-width: 480px;
        }
        .offline-icon {
            font-size: 5rem;
            color: #6366f1;
            margin-bottom: 24px;
            display: block;
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background: transparent;
            color: #f8fafc;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-left: 12px;
        }
        .btn-secondary:hover {
            border-color: #6366f1;
            color: #6366f1;
        }
        .retry-btn {
            margin-top: 8px;
        }
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-top: 32px;
        }
        .feature {
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 16px;
        }
        .feature i {
            font-size: 1.5rem;
            color: #6366f1;
            margin-bottom: 8px;
            display: block;
        }
        .feature span {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        @media (max-width: 480px) {
            .features { grid-template-columns: 1fr; }
            .btn-secondary { margin-left: 0; margin-top: 12px; }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <i class="fas fa-wifi offline-icon"></i>
        <h1>You're Offline</h1>
        <p>
            Don't worry! You can still browse previously loaded content.
            Some features may be limited until you're back online.
        </p>
        <div>
            <button class="btn-primary retry-btn" onclick="window.location.reload()">
                <i class="fas fa-sync-alt"></i> Try Again
            </button>
            <a href="index.html" class="btn-secondary">
                <i class="fas fa-home"></i> Go Home
            </a>
        </div>
        <div class="features">
            <div class="feature">
                <i class="fas fa-folder-open"></i>
                <span>View Projects</span>
            </div>
            <div class="feature">
                <i class="fas fa-graduation-cap"></i>
                <span>Browse Courses</span>
            </div>
            <div class="feature">
                <i class="fas fa-envelope"></i>
                <span>Contact Info</span>
            </div>
        </div>
    </div>
    <script>
        // Check if online and redirect
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
