<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Aurex Designs</title>
    <link rel="icon" href="IMG-20260403-WA0021(1).jpg" type="image/jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg: #0f0f1a; --text: #f8fafc; --muted: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .offline-card { max-width: 400px; }
        .offline-icon { width: 80px; height: 80px; border-radius: 24px; background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--primary); margin: 0 auto 24px; }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.75rem; margin-bottom: 12px; }
        p { color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: linear-gradient(135deg, var(--primary), #4f46e5); color: white; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.95rem; border: none; border-radius: 50px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.3); }
    </style>
<base target="_blank">
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon"><i class="fas fa-wifi"></i></div>
        <h1>You are offline</h1>
        <p>It looks like you have lost your internet connection. Some features may be unavailable until you are back online.</p>
        <a href="/" class="btn"><i class="fas fa-home"></i> Go Home</a>
        <button class="btn" onclick="location.reload()" style="margin-left: 12px; background: transparent; border: 2px solid rgba(255,255,255,0.1);"><i class="fas fa-redo"></i> Retry</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>
